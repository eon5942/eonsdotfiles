# ─────────────────────────────────────────────
#  picom — Everforest (tuned for VM / software rendering)
#  xrender backend, no blur: smooth on QXL / llvmpipe.
#  For even more FPS, set `shadow = false` or disable picom entirely.
# ─────────────────────────────────────────────

backend = "xrender";
vsync = false;
use-damage = true;

corner-radius = 0;

shadow = true;
shadow-radius = 8;
shadow-opacity = 0.35;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-color = "#000000";

fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;

rules: ({
  match = "window_type = 'dock' || window_type = 'desktop'";
  shadow = false;
});
