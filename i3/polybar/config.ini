; ─────────────────────────────────────────────
;  polybar — Everforest (full-width, top, green)
; ─────────────────────────────────────────────

[colors]
background = #232a2e
foreground = #d3c6aa
muted      = #7a8478
accent     = #a7c080
red        = #e67e80

[settings]
screenchange-reload = true
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

[bar/everforest]
monitor = ${env:MONITOR:}
monitor-strict = false
width = 100%
height = 30
offset-x = 0
offset-y = 0
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}
border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 2
module-margin-right = 2
bottom = false
wm-restack = i3
override-redirect = false

font-0 = Iosevka Nerd Font Mono:style=Medium:size=11;2
font-1 = Iosevka Nerd Font Mono:style=Regular:size=11;2

modules-left = launcher i3
modules-center = media
modules-right = tray pulseaudio network cpu memory temperature battery date

cursor-click = pointer
cursor-scroll = ns-resize

; ── launcher ─────────────────────────────────
[module/launcher]
type = custom/text
format = "%{F#a7c080}%{F-} apps"
format-foreground = #ffffff
format-padding = 2
click-left = rofi -show drun -theme ~/.config/rofi/everforest.rasi

; ── workspaces ───────────────────────────────
[module/i3]
type = internal/i3
format = <label-state>
index-sort = true
strip-wsnumbers = true
pin-workspaces = true

label-focused = %index%
label-focused-foreground = ${colors.accent}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 1

label-visible = %index%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 1

label-urgent = %index%
label-urgent-foreground = ${colors.red}
label-urgent-padding = 2

; ── media (playerctl) ────────────────────────
[module/media]
type = custom/script
exec = ~/.config/polybar/scripts/media.sh
interval = 2
label-foreground = ${colors.foreground}
label-padding = 2
label-maxlen = 48
click-left = playerctl play-pause 2>/dev/null
click-right = playerctl next 2>/dev/null

; ── volume ───────────────────────────────────
[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = "vol %percentage%%"
label-volume-foreground = ${colors.foreground}
label-volume-padding = 2
format-muted = <label-muted>
label-muted = "vol muted"
label-muted-foreground = ${colors.red}
label-muted-padding = 2
click-left = pavucontrol

; ── network ──────────────────────────────────
[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 5
label-foreground = ${colors.foreground}
label-padding = 2
click-left = nm-connection-editor

; ── cpu ──────────────────────────────────────
[module/cpu]
type = internal/cpu
interval = 2
label = "cpu %percentage%%"
label-foreground = ${colors.foreground}
label-padding = 2

; ── memory ───────────────────────────────────
[module/memory]
type = internal/memory
interval = 5
label = "mem %percentage_used%%"
label-foreground = ${colors.foreground}
label-padding = 2

; ── temperature ──────────────────────────────
[module/temperature]
type = custom/script
exec = ~/.config/polybar/scripts/temperature.sh
interval = 5
label-foreground = ${colors.foreground}
label-padding = 2

; ── battery ──────────────────────────────────
[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery.sh
interval = 10
label-foreground = ${colors.foreground}
label-padding = 2

; ── clock ────────────────────────────────────
[module/date]
type = internal/date
interval = 1.0
date = %a %d %b  %H:%M
label = %date%
label-foreground = ${colors.foreground}
label-padding = 2

; ── tray ─────────────────────────────────────
[module/tray]
type = internal/tray
tray-size = 60%
tray-padding = 2
