# ─────────────────────────────────────────────
#  picom — minimal, fast (for QXL VM / software rendering)
#  xrender backend: no blur, no shadows, no fade.
#  Keeps transparency (kitty) working with minimal cost.
# ─────────────────────────────────────────────

backend = "xrender";
vsync = false;
use-damage = true;
shadow = false;
fading = false;
