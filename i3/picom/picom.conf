# ─────────────────────────────────────────────
#  picom — Everforest + blur
#  GLX backend (required for blur). On the QXL VM
#  blur is software-rendered, so if FPS drops, lower
#  blur-strength or set blur-method = "box".
# ─────────────────────────────────────────────

backend = "glx";
vsync = true;
use-damage = true;
dithered-present = false;

corner-radius = 6;

blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;

shadow = true;
shadow-radius = 8;
shadow-opacity = 0.35;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-color = "#000000";

fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;

rules: ({
  match = "window_type = 'dock' || window_type = 'desktop'";
  blur-background = false;
  shadow = false;
});
