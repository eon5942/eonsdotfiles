# ─────────────────────────────────────────────
#  picom — Everforest compositor settings
#  Flat/square (no radius), blur, shadows.
#  If you have no GPU / it fails, change backend to "xrender"
#  and remove the blur-* lines.
# ─────────────────────────────────────────────

backend = "glx";
vsync = true;
use-damage = true;
dithered-present = false;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# Rounded corners (flat, square)
corner-radius = 0;

# Shadows
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.45;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-color = "#000000";

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Opacity / dim
frame-opacity = 0.8;
inactive-dim = 0.1;

# Blur (transparent windows, e.g. the polybar panel)
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;

rules: ({
  match = "window_type = 'dock' || window_type = 'desktop'";
  blur-background = false;
  corner-radius = 0;
  shadow = false;
}, {
  match = "window_type = 'tooltip' || name = 'Notification' || class_g = 'Dunst'";
  shadow = false;
});
