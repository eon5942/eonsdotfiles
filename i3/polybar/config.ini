; ─────────────────────────────────────────────
;  polybar — Everforest (mango slot look, no icons)
; ─────────────────────────────────────────────

[colors]
bg      = #b3232a2e
surface = #26343f44
fg      = #d3c6aa
muted   = #9da9a0
green   = #a7c080
aqua    = #83c092
blue    = #7fbbb3
yellow  = #dbbc7f
red     = #e67e80

[settings]
screenchange-reload = true
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

[bar/everforest]
monitor = ${env:MONITOR:}
monitor-strict = false
width = 100%
height = 38
offset-x = 0
offset-y = 4
radius = 6
background = ${colors.bg}
foreground = ${colors.fg}
border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1
bottom = false
wm-restack = i3
override-redirect = false

font-0 = Iosevka Nerd Font Mono:style=Medium:size=11;2
font-1 = Iosevka Nerd Font Mono:style=Regular:size=11;2

modules-left = launcher i3 date
modules-center = media
modules-right = pulseaudio network cpu memory temperature battery tray

cursor-click = pointer
cursor-scroll = ns-resize

; ── launcher ─────────────────────────────────
[module/launcher]
type = custom/text
format = "APPS"
format-foreground = ${colors.green}
format-background = ${colors.surface}
format-padding = 2
click-left = rofi -show drun -theme ~/.config/rofi/everforest.rasi

; ── tags / workspaces ────────────────────────
[module/i3]
type = internal/i3
format = <label-state>
index-sort = true
strip-wsnumbers = true
pin-workspaces = true

label-focused = %index%
label-focused-foreground = #232a2e
label-focused-background = ${colors.green}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.muted}
label-unfocused-background = ${colors.surface}
label-unfocused-padding = 2

label-visible = %index%
label-visible-foreground = ${colors.fg}
label-visible-background = ${colors.surface}
label-visible-padding = 2

label-urgent = %index%
label-urgent-foreground = #232a2e
label-urgent-background = ${colors.red}
label-urgent-padding = 2

; ── clock ────────────────────────────────────
[module/date]
type = internal/date
interval = 1.0
date = %a %d %b   %H:%M
label = %date%
label-foreground = ${colors.yellow}
label-background = ${colors.surface}
label-padding = 2

; ── media (playerctl) ────────────────────────
[module/media]
type = custom/script
exec = ~/.config/polybar/scripts/media.sh
interval = 2
label-foreground = ${colors.yellow}
label-background = ${colors.surface}
label-padding = 2
label-maxlen = 48
click-left = playerctl play-pause 2>/dev/null
click-right = playerctl next 2>/dev/null

; ── volume ───────────────────────────────────
[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = "VOL %percentage%%"
label-volume-foreground = ${colors.fg}
label-volume-background = ${colors.surface}
label-volume-padding = 2
format-muted = <label-muted>
label-muted = "VOL muted"
label-muted-foreground = ${colors.red}
label-muted-background = ${colors.surface}
label-muted-padding = 2
click-left = pavucontrol

; ── network ──────────────────────────────────
[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 5
label-foreground = ${colors.blue}
label-background = ${colors.surface}
label-padding = 2
click-left = nm-connection-editor

; ── cpu ──────────────────────────────────────
[module/cpu]
type = internal/cpu
interval = 2
label = "CPU %percentage%%"
label-foreground = ${colors.green}
label-background = ${colors.surface}
label-padding = 2

; ── memory ───────────────────────────────────
[module/memory]
type = internal/memory
interval = 5
label = "MEM %percentage_used%%"
label-foreground = ${colors.aqua}
label-background = ${colors.surface}
label-padding = 2

; ── temperature ──────────────────────────────
[module/temperature]
type = custom/script
exec = ~/.config/polybar/scripts/temperature.sh
interval = 5
label-foreground = ${colors.yellow}
label-background = ${colors.surface}
label-padding = 2

; ── battery ──────────────────────────────────
[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery.sh
interval = 10
label-foreground = ${colors.green}
label-background = ${colors.surface}
label-padding = 2

; ── tray ─────────────────────────────────────
[module/tray]
type = internal/tray
tray-size = 60%
tray-padding = 2
tray-background = ${colors.surface}
