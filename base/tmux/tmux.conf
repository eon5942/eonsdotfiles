# ============================================================================
# tmux — monochrome rice
#   prefix: C-a   |   plugins via tpm   |   font: Iosevka Nerd Font
# ============================================================================

# --- general ----------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g default-shell "/run/current-system/sw/bin/fish"
set -g escape-time 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g focus-events on
set -g history-limit 10000
set -g set-clipboard on
set -g display-time 1500

# --- prefix -----------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- sessions ---------------------------------------------------------------
bind s choose-tree -Zs            # session picker (fullscreen)
bind w choose-tree -Zw            # window picker
bind d detach-client
bind $ command-prompt -I "#S" "rename-session '%%'"
bind D choose-client              # detach a client
bind C-s switch-client -l         # jump to last session

# --- windows ----------------------------------------------------------------
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -I "#W" "rename-window '%%'"
bind & kill-window
bind f command-prompt -p "find-window" "find-window -Z -- '%%'"
bind n next-window
bind p previous-window
bind Tab next-window
bind C-n next-window
bind C-p previous-window
bind -r C-h swap-window -t -1
bind -r C-l swap-window -t +1

# --- panes ------------------------------------------------------------------
# splits (stay in current dir)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# move
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind o select-pane -t :.+
bind q display-panes -d 0        # show pane numbers, type one to jump

# move between panes without prefix (vim-tmux-navigator compatible)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# resize
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# lifecycle
bind x kill-pane
bind z resize-pane -Z            # zoom / unzoom
bind ! break-pane                # move pane to its own window
bind "{" swap-pane -U
bind "}" swap-pane -D
bind -r M-Left  resize-pane -L 5
bind -r M-Right resize-pane -R 5
bind -r M-Up    resize-pane -U 5
bind -r M-Down  resize-pane -D 5

# --- layouts ----------------------------------------------------------------
bind Space next-layout
bind M-1 select-layout even-horizontal
bind M-2 select-layout even-vertical
bind M-3 select-layout main-horizontal
bind M-4 select-layout main-vertical
bind M-5 select-layout tiled

# --- copy / paste -----------------------------------------------------------
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind [ copy-mode
bind ] paste-buffer
bind = choose-buffer              # pick a buffer to paste
bind P choose-buffer -Z \; paste-buffer -p

# --- misc -------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"
bind t clock-mode
bind : command-prompt

# --- look & feel ------------------------------------------------------------
set -g status-interval 5
set -g status-position bottom

# pane borders: inactive subtle gray, active bright white
set -g pane-border-style "fg=#555555"
set -g pane-active-border-style "fg=#ffffff"

# popup / message / menu (monochrome)
set -g message-style "bg=#000000,fg=#ffffff"
set -g message-command-style "bg=#000000,fg=#ffffff"
set -g menu-style "bg=#000000,fg=#ffffff"
set -g menu-selected-style "bg=#ffffff,fg=#000000"
set -g menu-border-style "fg=#ffffff"
set -g popup-style "bg=#000000,fg=#ffffff"
set -g popup-border-style "fg=#ffffff"

# window list
setw -g window-status-style "fg=#666666,bg=#000000"
setw -g window-status-activity-style "fg=#ffffff,bg=#000000"
setw -g window-status-bell-style "fg=#ffffff,bg=#000000,bold"
setw -g window-status-current-style "fg=#000000,bg=#ffffff,bold"
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#666666] #I:#W "
setw -g window-status-current-format "#[fg=#000000,bg=#ffffff] #I:#W #[fg=#ffffff,bg=#000000]"

set -g status-style "bg=#000000,fg=#ffffff"

# left: session name (inverted block) — swaps to prefix badge while prefix held
set -g status-left "#{?client_prefix,#[bg=#ffffff,fg=#000000,bold]  C-a  ,#[bg=#ffffff,fg=#000000,bold]  #S  }#[bg=#000000,fg=#ffffff]"
set -g status-left-length 48

# right: battery · date · time
set -g status-right "#[fg=#666666]#{?#{==:#{battery_status},charging}, , } #{battery_percentage}  #[fg=#444444]  #[fg=#999999]%a %d %b #[fg=#444444]  #[fg=#000000,bg=#ffffff,bold] %H:%M #[fg=#ffffff,bg=#000000]"
set -g status-right-length 96

# --- plugins (tpm) ----------------------------------------------------------
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# resurrect / continuum
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-save-shell-history 'on'
set -g @resurrect-strategy-vim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# bootstrap tpm on fresh installs, then load plugins
if "test ! -d $HOME/.config/tmux/plugins/tpm" \
  "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm $HOME/.config/tmux/plugins/tpm'"
run "$HOME/.config/tmux/plugins/tpm/tpm"
