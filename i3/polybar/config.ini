; ─────────────────────────────────────────────
;  polybar — Everforest (flat, mono-style)
; ─────────────────────────────────────────────

[colors]
bg     = #232a2e
fg     = #d3c6aa
muted  = #9da9a0
dim    = #56635f
accent = #a7c080
red    = #e67e80

[settings]
screenchange-reload = true
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

[bar/everforest]
monitor = ${env:MONITOR:}
monitor-strict = false
width = 100%
height = 30
offset-x = 0
offset-y = 0
radius = 0
background = ${colors.bg}
foreground = ${colors.fg}
border-size = 0
padding-left = 0
padding-right = 0
module-margin-left = 1
module-margin-right = 1
bottom = false
wm-restack = i3
override-redirect = false

font-0 = Iosevka Nerd Font Mono:style=Medium:size=11;1
font-1 = Iosevka Nerd Font Mono:style=Regular:size=11;1
font-2 = Noto Color Emoji:scale=10;1

modules-left = launcher i3 date
modules-center = media
modules-right = pulseaudio network cpu memory temperature battery tray

cursor-click = pointer
cursor-scroll = ns-resize

; ── launcher ─────────────────────────────────
[module/launcher]
type = custom/text
format = " apps"
format-foreground = ${colors.accent}
format-padding = 1
click-left = rofi -show drun -theme ~/.config/rofi/everforest.rasi

; ── tags / workspaces ────────────────────────
[module/i3]
type = internal/i3
format = <label-state>
index-sort = true
strip-wsnumbers = true
pin-workspaces = true

label-focused = %index%
label-focused-foreground = ${colors.bg}
label-focused-background = ${colors.accent}
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-foreground = ${colors.dim}
label-unfocused-padding = 1

label-visible = %index%
label-visible-foreground = ${colors.fg}
label-visible-padding = 1

label-urgent = %index%
label-urgent-foreground = ${colors.bg}
label-urgent-background = ${colors.red}
label-urgent-padding = 1

; ── clock ────────────────────────────────────
[module/date]
type = internal/date
interval = 1.0
date = %a %d %b  %H:%M
label = %date%
label-foreground = ${colors.fg}
label-padding = 1

; ── media (playerctl) ────────────────────────
[module/media]
type = custom/script
exec = ~/.config/polybar/scripts/media.sh
interval = 2
label-foreground = ${colors.muted}
label-padding = 1
label-maxlen = 48
click-left = playerctl play-pause 2>/dev/null
click-right = playerctl next 2>/dev/null

; ── volume ───────────────────────────────────
[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "vol "
format-volume-prefix-foreground = ${colors.muted}
format-volume = <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.muted}
label-volume-padding = 1

format-muted-prefix = "vol "
format-muted-prefix-foreground = ${colors.fg}
format-muted = <label-muted>
label-muted = muted
label-muted-foreground = ${colors.fg}
label-muted-background = ${colors.dim}
label-muted-padding = 1
click-left = pavucontrol

; ── network ──────────────────────────────────
[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 5
label-foreground = ${colors.muted}
label-padding = 1
click-left = nm-connection-editor

; ── cpu ──────────────────────────────────────
[module/cpu]
type = internal/cpu
interval = 2
label = cpu %percentage%%
label-foreground = ${colors.muted}
label-padding = 1

; ── memory ───────────────────────────────────
[module/memory]
type = internal/memory
interval = 5
label = mem %percentage_used%%
label-foreground = ${colors.muted}
label-padding = 1

; ── temperature ──────────────────────────────
[module/temperature]
type = custom/script
exec = ~/.config/polybar/scripts/temperature.sh
interval = 5
label-foreground = ${colors.muted}
label-padding = 1

; ── battery ──────────────────────────────────
[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery.sh
interval = 10
label-foreground = ${colors.muted}
label-padding = 1

; ── tray ─────────────────────────────────────
[module/tray]
type = internal/tray
tray-size = 60%
tray-padding = 1
