[main]
font=Iosevka Nerd Font Mono:size=13
pad=6x6
dpi-aware=yes
bold-text-in-bright=no
selection-target=clipboard

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes

[colors-dark]
foreground=ffffff
background=000000
cursor=ffffff 000000
selection-foreground=000000
selection-background=ffffff
regular0=000000
regular1=444444
regular2=666666
regular3=888888
regular4=aaaaaa
regular5=cccccc
regular6=eeeeee
regular7=ffffff
bright0=333333
bright1=555555
bright2=777777
bright3=999999
bright4=bbbbbb
bright5=dddddd
bright6=ffffff
bright7=ffffff

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+r
